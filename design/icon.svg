<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4050"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb877"/>
      <stop offset="1" stop-color="#e8663a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- основа: squircle 824x824 по сетке macOS Big Sur -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>
  <!-- сайдбар со списком сессий -->
  <rect x="180" y="180" width="214" height="664" rx="64" fill="#fff" fill-opacity="0.06"/>
  <rect x="212" y="250" width="150" height="40" rx="20" fill="url(#accent)"/>
  <rect x="212" y="330" width="150" height="40" rx="20" fill="#fff" fill-opacity="0.22"/>
  <rect x="212" y="410" width="150" height="40" rx="20" fill="#fff" fill-opacity="0.22"/>
  <!-- промпт терминала -->
  <polyline points="500,392 618,512 500,632" fill="none" stroke="url(#accent)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="660" y="612" width="150" height="68" rx="34" fill="url(#accent)"/>
</svg>
